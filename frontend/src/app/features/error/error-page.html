<main class="error-page">
  <div class="error-glow error-glow-one" aria-hidden="true"></div>
  <div class="error-glow error-glow-two" aria-hidden="true"></div>

  <a [routerLink]="homePath()" class="error-brand" aria-label="CAA Integrador — página inicial">
    <span class="error-brand-icon" aria-hidden="true">🌸</span>
    <span>CAA Integrador</span>
  </a>

  <section class="error-card" aria-labelledby="error-title">
    <div class="error-illustration" aria-hidden="true">
      <span class="error-code">404</span>
      <svg viewBox="0 0 180 120" role="presentation">
        <path class="error-path" d="M20 91c28-55 47 18 73-27 20-35 38-8 67-41" />
        <circle class="error-dot" cx="20" cy="91" r="7" />
        <circle class="error-dot error-dot-end" cx="160" cy="23" r="7" />
      </svg>
    </div>

    <p class="error-eyebrow">Página não encontrada</p>
    <h1 id="error-title">Parece que este caminho não existe.</h1>
    <p class="error-copy">
      O endereço pode ter sido digitado incorretamente ou a página pode ter mudado de lugar.
      Tudo bem — ajudamos você a voltar.
    </p>

    <a [routerLink]="homePath()" class="btn btn-primary error-action">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5v-9.7Z" />
      </svg>
      {{ homeLabel() }}
    </a>
  </section>

  <p class="error-help">Se o problema continuar, confira o endereço e tente novamente.</p>
</main>
