@if (loading()) {
  <app-loading-spinner />
} @else if (perfil(); as p) {
<div class="max-w-2xl mx-auto px-6 py-8">
  <h1 class="text-2xl font-extrabold mb-6">Meu Perfil</h1>

  <!-- Avatar upload -->
  <div class="flex items-center gap-6 mb-8">
    <label class="cursor-pointer relative group">
      <app-avatar [fotoUrl]="fotoUrl()" [nome]="nome() || p.nome" size="lg" />
      <div class="absolute inset-0 rounded-full bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
        @if (uploadingFoto()) {
          <span class="loading loading-spinner loading-sm text-white"></span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
        }
      </div>
      <input type="file" class="hidden" accept="image/*" (change)="onFotoSelected($event)" />
    </label>
    <div>
      <p class="font-bold text-lg">{{ p.nome }}</p>
      <p class="text-sm text-base-content/60">{{ p.email }}</p>
      <span class="badge badge-outline badge-sm mt-1">{{ p.tipoUsuario === 'profissional' ? 'Profissional' : 'Familiar' }}</span>
    </div>
  </div>

  <div class="flex flex-col gap-4">
    <!-- Nome -->
    <div class="form-control">
      <label class="label"><span class="label-text font-semibold">Nome</span></label>
      <input class="input input-bordered" type="text" [ngModel]="nome()" (ngModelChange)="nome.set($event)" name="nome" />
    </div>

    <!-- Bio -->
    <div class="form-control">
      <label class="label"><span class="label-text font-semibold">Bio</span></label>
      <textarea class="textarea textarea-bordered resize-none" rows="3"
        placeholder="Uma breve apresentação..."
        [ngModel]="bio()" (ngModelChange)="bio.set($event)" name="bio"></textarea>
    </div>

    <!-- Telefone -->
    <div class="form-control">
      <label class="label"><span class="label-text font-semibold">Telefone</span></label>
      <input class="input input-bordered" type="tel" placeholder="(00) 00000-0000"
        [ngModel]="telefone()" (ngModelChange)="telefone.set($event)" name="telefone" />
    </div>

    <!-- Profissional fields -->
    @if (p.tipoUsuario === 'profissional') {
      <div class="form-control">
        <label class="label"><span class="label-text font-semibold">Especialidade</span></label>
        <input class="input input-bordered" type="text" placeholder="Ex: Terapeuta Ocupacional"
          [ngModel]="especialidade()" (ngModelChange)="especialidade.set($event)" name="especialidade" />
      </div>
      <div class="form-control">
        <label class="label"><span class="label-text font-semibold">Registro profissional</span></label>
        <input class="input input-bordered" type="text" [value]="p.registroProfissional ?? ''" disabled />
      </div>
    }

    <div class="flex items-center gap-3 pt-2">
      <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
        @if (saving()) { <span class="loading loading-spinner loading-xs"></span> }
        Salvar
      </button>
      @if (saved()) {
        <span class="text-success text-sm font-medium">Perfil atualizado!</span>
      }
    </div>
  </div>
</div>
}
