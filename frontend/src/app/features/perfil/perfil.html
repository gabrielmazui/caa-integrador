@if (loading()) {
  <app-loading-spinner />
} @else if (perfil(); as p) {
<div class="w-full max-w-md mx-auto px-4 py-10 flex flex-col gap-8">

  <!-- Avatar + identidade -->
  <div class="flex flex-col items-center gap-3">
    <label class="cursor-pointer relative group">
      <app-avatar [fotoUrl]="fotoUrl()" [nome]="nome() || p.nome" size="lg" />
      <div class="absolute inset-0 rounded-full bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
        @if (uploadingFoto()) {
          <span class="loading loading-spinner loading-sm text-white"></span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
        }
      </div>
      <input type="file" class="hidden" accept="image/*" (change)="onFotoSelected($event)" />
    </label>
    <div class="text-center">
      <p class="font-bold text-lg leading-tight">{{ p.nome }}</p>
      <p class="text-sm text-base-content/60">{{ p.email }}</p>
      <span class="badge badge-outline badge-sm mt-1">
        {{ p.tipoUsuario === 'profissional' ? 'Profissional' : 'Familiar' }}
      </span>
    </div>
  </div>

  <!-- Form -->
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body gap-5">

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold">Nome *</label>
        <input class="input input-bordered w-full focus:outline-none"
          type="text"
          [class.input-error]="submitted() && !nome().trim()"
          [ngModel]="nome()" (ngModelChange)="nome.set($event)" />
        @if (submitted() && !nome().trim()) {
          <p class="text-error text-xs">Campo obrigatório</p>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold">Bio</label>
        <textarea class="textarea textarea-bordered w-full resize-none focus:outline-none" rows="3"
          placeholder="Uma breve apresentação..."
          [ngModel]="bio()" (ngModelChange)="bio.set($event)"></textarea>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold">Telefone</label>
        <input class="input input-bordered w-full focus:outline-none"
          type="tel" placeholder="(00) 00000-0000"
          [ngModel]="telefone()" (ngModelChange)="telefone.set($event)" />
      </div>

      @if (p.tipoUsuario === 'profissional') {
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold">Especialidade</label>
          <input class="input input-bordered w-full focus:outline-none"
            type="text" placeholder="Ex: Terapeuta Ocupacional"
            [ngModel]="especialidade()" (ngModelChange)="especialidade.set($event)" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold">Registro profissional</label>
          <input class="input input-bordered w-full bg-base-200 cursor-not-allowed"
            type="text" [value]="p.registroProfissional ?? ''" disabled />
        </div>
      }

      <div class="flex items-center justify-end gap-3 pt-1 border-t border-base-200">
        @if (saved()) {
          <span class="text-success text-sm font-medium">Salvo!</span>
        }
        <button class="btn btn-primary btn-sm" (click)="save()" [disabled]="saving()">
          @if (saving()) { <span class="loading loading-spinner loading-xs"></span> }
          Salvar
        </button>
      </div>

    </div>
  </div>

</div>
}
