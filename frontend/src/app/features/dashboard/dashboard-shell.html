<div class="h-screen flex flex-col bg-base-100">

  <!-- Top Navbar -->
  <nav class="sticky top-0 z-30 bg-base-100 border-b border-base-200 flex-shrink-0">
    <div class="h-14 px-4 flex items-center gap-3 max-w-screen-xl mx-auto w-full">

      <!-- Logo -->
      <a routerLink="/home" class="font-extrabold text-primary text-base whitespace-nowrap mr-1">
        🌸 CAA
      </a>

      <!-- Child switcher — só quando em /crianca/:id -->
      @if (isOnCriancaPage() && criancaAtual(); as c) {
        <div class="dropdown dropdown-bottom">
          <button tabindex="0" class="btn btn-ghost btn-sm gap-2 max-w-48">
            <app-avatar [fotoUrl]="c.fotoUrl" [nome]="c.nome" size="xs" />
            <span class="font-semibold truncate">{{ c.nome }}</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 flex-shrink-0 opacity-60" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
          <ul tabindex="0" class="dropdown-content bg-base-100 rounded-box shadow-lg border border-base-200 w-64 mt-1 p-0 overflow-hidden">
            <li class="p-2 border-b border-base-200">
              <input
                class="input input-sm input-bordered w-full"
                placeholder="Buscar criança..."
                [ngModel]="childSearch()"
                (ngModelChange)="childSearch.set($event)"
              />
            </li>
            <ul class="menu flex-nowrap max-h-64 overflow-y-auto p-1">
              @for (child of filteredCriancas(); track child.id) {
                <li>
                  <a [routerLink]="['/crianca', child.id, 'feed']"
                     class="flex items-center gap-2"
                     [class.active]="child.id === c.id"
                     (click)="closeDropdown()">
                    <app-avatar [fotoUrl]="child.fotoUrl" [nome]="child.nome" size="xs" />
                    <span class="truncate">{{ child.nome }}</span>
                  </a>
                </li>
              }
              @if (filteredCriancas().length === 0) {
                <li class="px-3 py-2 text-sm text-base-content/50">Nenhuma criança encontrada</li>
              }
            </ul>
          </ul>
        </div>
      }

      <div class="flex-1"></div>

<!-- Profile dropdown -->
      <div class="dropdown dropdown-end dropdown-bottom">
        <button tabindex="0" class="btn btn-ghost btn-circle">
          <app-avatar
            [fotoUrl]="auth.currentUser()?.fotoUrl ?? null"
            [nome]="auth.currentUser()?.nome ?? 'U'"
            size="sm" />
        </button>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box shadow-lg border border-base-200 w-44 p-1 mt-1">
          <li class="menu-title text-xs px-2 py-1 opacity-60">{{ auth.currentUser()?.nome }}</li>
          <li><a routerLink="/perfil">Meu perfil</a></li>
          <li><button (click)="logout()">Sair</button></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- Main content -->
  <div class="flex-1 overflow-hidden flex flex-col">
    <router-outlet />
  </div>

</div>
<app-toast />
