<div class="modal modal-open" role="dialog" aria-modal="true" aria-labelledby="termo-modal-title">
  <div class="modal-box max-w-md">
    <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="close.emit()" aria-label="Fechar">✕</button>
    <h2 id="termo-modal-title" class="font-bold text-lg mb-4">Novo termo</h2>

    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <label class="form-control">
        <div class="label"><span class="label-text font-semibold">Termo *</span></div>
        <input type="text" class="input input-bordered"
          [class.input-error]="submitted() && !termo().trim()"
          placeholder="Ex: PECS"
          [ngModel]="termo()" (ngModelChange)="termo.set($event)" required name="termo" />
        @if (submitted() && !termo().trim()) {
          <p class="text-error text-xs mt-1">Campo obrigatório</p>
        }
      </label>

      <label class="form-control">
        <div class="label"><span class="label-text font-semibold">Definição *</span></div>
        <textarea class="textarea textarea-bordered resize-none"
          [class.textarea-error]="submitted() && !definicao().trim()"
          rows="4"
          placeholder="Explique o termo de forma clara..."
          [ngModel]="definicao()" (ngModelChange)="definicao.set($event)" required name="definicao"></textarea>
        @if (submitted() && !definicao().trim()) {
          <p class="text-error text-xs mt-1">Campo obrigatório</p>
        }
      </label>

      <div class="modal-action">
        <button type="button" class="btn btn-ghost" (click)="close.emit()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          @if (loading()) { <span class="loading loading-spinner loading-sm"></span> }
          Salvar
        </button>
      </div>
    </form>
  </div>
  <div class="modal-backdrop" (click)="close.emit()"></div>
</div>
