@if (crianca(); as c) {
<div class="flex flex-col flex-1 min-h-0 max-w-5xl w-full mx-auto px-6 pt-4">
  <!-- Child header -->
  <div class="bg-gradient-to-r from-primary/10 to-secondary/10 rounded-2xl p-4 mb-3 flex items-center gap-4 flex-shrink-0">
    <app-avatar [fotoUrl]="c.fotoUrl" [nome]="c.nome" size="lg" />
    <div>
      <h2 class="text-2xl font-extrabold">{{ c.nome }}</h2>
      @if (age(); as a) {
        <p class="text-sm text-base-content/60">{{ a }} anos</p>
      }
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs tabs-lifted tabs-bordered mb-3 flex-shrink-0" role="tablist">
    <a role="tab" class="tab gap-2"
      [routerLink]="['feed']" routerLinkActive="tab-active">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"/>
      </svg>
      Feed
    </a>

    @if (c.podeVerChat) {
      <a role="tab" class="tab gap-2"
        [routerLink]="['chat']" routerLinkActive="tab-active">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/>
        </svg>
        Chat
      </a>
    }

    @if (auth.isProfissional()) {
      <a role="tab" class="tab gap-2"
        [routerLink]="['pei']" routerLinkActive="tab-active">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
          <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/>
        </svg>
        PEI
      </a>
    }

    <a role="tab" class="tab gap-2"
      [routerLink]="['glossario']" routerLinkActive="tab-active">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
      </svg>
      Glossário
    </a>

    <a role="tab" class="tab gap-2"
      [routerLink]="['equipe']" routerLinkActive="tab-active">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"/>
      </svg>
      Equipe
    </a>

    @if (c.podeEditarCrianca) {
      <a role="tab" class="tab gap-2"
        [routerLink]="['perfil']" routerLinkActive="tab-active">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
        Perfil
      </a>
    }
  </div>

  <div class="flex-1 min-h-0 flex flex-col">
    <router-outlet />
  </div>
</div>
}
