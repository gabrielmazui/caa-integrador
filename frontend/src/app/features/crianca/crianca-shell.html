@if (crianca(); as c) {
<div class="flex flex-col flex-1 min-h-0">

  <!-- Tab bar -->
  <div class="border-b border-base-200 bg-base-100 flex-shrink-0">
    <div class="max-w-4xl mx-auto px-4">
      <div class="flex justify-center gap-0 overflow-x-auto scrollbar-none">

        <a class="inline-flex items-center whitespace-nowrap border-b-2 border-transparent px-4 py-3 text-sm font-medium text-base-content/60 hover:text-primary transition-colors"
          [routerLink]="['feed']"
          routerLinkActive="border-primary !text-primary">
          Feed
        </a>

        @if (c.podeVerChat) {
          <a class="inline-flex items-center whitespace-nowrap border-b-2 border-transparent px-4 py-3 text-sm font-medium text-base-content/60 hover:text-primary transition-colors"
            [routerLink]="['chat']"
            routerLinkActive="border-primary !text-primary">
            Chat
          </a>
        }

        @if (auth.isProfissional()) {
          <a class="inline-flex items-center whitespace-nowrap border-b-2 border-transparent px-4 py-3 text-sm font-medium text-base-content/60 hover:text-primary transition-colors"
            [routerLink]="['pei']"
            routerLinkActive="border-primary !text-primary">
            PEI
          </a>
        }

        <a class="inline-flex items-center whitespace-nowrap border-b-2 border-transparent px-4 py-3 text-sm font-medium text-base-content/60 hover:text-primary transition-colors"
          [routerLink]="['glossario']"
          routerLinkActive="border-primary !text-primary">
          Glossário
        </a>

        <a class="inline-flex items-center whitespace-nowrap border-b-2 border-transparent px-4 py-3 text-sm font-medium text-base-content/60 hover:text-primary transition-colors"
          [routerLink]="['equipe']"
          routerLinkActive="border-primary !text-primary">
          Equipe
        </a>

        @if (c.podeEditarCrianca) {
          <a class="inline-flex items-center whitespace-nowrap border-b-2 border-transparent px-4 py-3 text-sm font-medium text-base-content/60 hover:text-primary transition-colors"
            [routerLink]="['perfil']"
            routerLinkActive="border-primary !text-primary">
            Perfil
          </a>
        }

      </div>
    </div>
  </div>

  <!-- Child content -->
  <div class="flex-1 min-h-0 overflow-hidden flex flex-col">
    <router-outlet />
  </div>

</div>
}
