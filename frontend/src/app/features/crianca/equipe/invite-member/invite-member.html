<div class="modal modal-open" role="dialog" aria-modal="true" aria-labelledby="invite-modal-title">
  <div class="modal-box max-w-md">
    <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="close.emit()" aria-label="Fechar">✕</button>
    <h2 id="invite-modal-title" class="font-bold text-lg mb-5">Convidar membro</h2>

    <div class="flex flex-col gap-4">

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold">E-mail *</label>
        <input type="email" class="input input-bordered w-full focus:outline-none"
          [class.input-error]="submitted() && !email().trim()"
          placeholder="email@exemplo.com"
          [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" />
        @if (submitted() && !email().trim()) {
          <p class="text-error text-xs">Campo obrigatório</p>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold">Tipo de conta do convidado</label>
        <select class="select select-bordered w-full focus:outline-none"
          [ngModel]="papel()" (ngModelChange)="papel.set($event)" name="papel">
          @for (p of papeis; track p[0]) {
            <option [value]="p[0]">{{ p[1] }}</option>
          }
        </select>
        <p class="text-xs text-base-content/50">Deve corresponder ao tipo de conta cadastrado pelo convidado.</p>
      </div>

      @if (papel() === 'responsavel') {
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold">Parentesco <span class="font-normal text-base-content/40">(opcional)</span></label>
          <select class="select select-bordered w-full focus:outline-none"
            [ngModel]="relacaoResponsavel()" (ngModelChange)="relacaoResponsavel.set($event)" name="relacao">
            <option value="">Não informar</option>
            @for (r of relacoes; track r[0]) {
              <option [value]="r[0]">{{ r[1] }}</option>
            }
          </select>
        </div>

        @if (relacaoResponsavel() === 'outro') {
          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold">Qual é o parentesco? *</label>
            <input type="text" class="input input-bordered w-full focus:outline-none"
              [class.input-error]="submitted() && !descricaoRelacao().trim()"
              placeholder="Ex: Avó, tio, irmão"
              [ngModel]="descricaoRelacao()" (ngModelChange)="descricaoRelacao.set($event)" name="descricaoRelacao" />
            @if (submitted() && !descricaoRelacao().trim()) {
              <p class="text-error text-xs">Informe o parentesco</p>
            }
          </div>
        }
      }

      <div class="flex justify-end gap-2 pt-2 border-t border-base-200">
        <button type="button" class="btn btn-ghost btn-sm" (click)="close.emit()">Cancelar</button>
        <button type="button" class="btn btn-primary btn-sm" [disabled]="loading()" (click)="submit()">
          @if (loading()) { <span class="loading loading-spinner loading-xs"></span> }
          Convidar
        </button>
      </div>

    </div>
  </div>
  <div class="modal-backdrop" (click)="close.emit()"></div>
</div>
