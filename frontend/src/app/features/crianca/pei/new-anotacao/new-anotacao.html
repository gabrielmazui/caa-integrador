<div class="modal modal-open" role="dialog" aria-modal="true" aria-labelledby="pei-modal-title">
  <div class="modal-box max-w-lg">
    <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" (click)="close.emit()" aria-label="Fechar">✕</button>
    <h2 id="pei-modal-title" class="font-bold text-lg mb-4">Nova anotação PEI</h2>

    @if (error()) {
      <div class="alert alert-error text-sm mb-4" role="alert">{{ error() }}</div>
    }

    <form (ngSubmit)="submit()" class="flex flex-col gap-4">
      <label class="form-control">
        <div class="label"><span class="label-text font-semibold">Categoria</span></div>
        <select class="select select-bordered" [ngModel]="categoria()" (ngModelChange)="categoria.set($event)" name="categoria">
          @for (cat of categorias; track cat[0]) {
            <option [value]="cat[0]">{{ cat[1] }}</option>
          }
        </select>
      </label>

      <label class="form-control">
        <div class="label"><span class="label-text font-semibold">Conteúdo</span></div>
        <textarea class="textarea textarea-bordered resize-none" rows="5"
          placeholder="Descreva a observação, objetivo ou estratégia..."
          [ngModel]="conteudo()" (ngModelChange)="conteudo.set($event)" required name="conteudo"></textarea>
      </label>

      <div class="grid grid-cols-2 gap-3">
        <label class="form-control">
          <div class="label"><span class="label-text font-semibold">Semestre</span></div>
          <select class="select select-bordered" [ngModel]="semestre()" (ngModelChange)="setSemestre($event)" name="semestre">
            <option [value]="1">1º semestre</option>
            <option [value]="2">2º semestre</option>
          </select>
        </label>
        <label class="form-control">
          <div class="label"><span class="label-text font-semibold">Ano</span></div>
          <input type="number" class="input input-bordered" [ngModel]="ano()" (ngModelChange)="ano.set(+$event)" name="ano" min="2000" max="2200" />
        </label>
      </div>

      <div class="modal-action">
        <button type="button" class="btn btn-ghost" (click)="close.emit()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading() || !conteudo().trim()">
          @if (loading()) { <span class="loading loading-spinner loading-sm"></span> }
          Salvar
        </button>
      </div>
    </form>
  </div>
  <div class="modal-backdrop" (click)="close.emit()"></div>
</div>
