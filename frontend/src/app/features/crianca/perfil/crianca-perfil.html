@if (crianca(); as c) {
<div class="w-full max-w-md mx-auto px-4 py-6 flex flex-col gap-8">

  <!-- Avatar -->
  <div class="flex flex-col items-center gap-3">
    <label class="cursor-pointer relative group">
      <app-avatar [fotoUrl]="fotoUrl()" [nome]="nome() || c.nome" size="lg" />
      <div class="absolute inset-0 rounded-full bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
        @if (uploadingFoto()) {
          <span class="loading loading-spinner loading-sm text-white"></span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
        }
      </div>
      <input type="file" class="hidden" accept="image/*" (change)="onFotoSelected($event)" />
    </label>
    <p class="font-bold text-lg">{{ c.nome }}</p>
  </div>

  <!-- Form -->
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body gap-5">

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold">Nome completo *</label>
        <input class="input input-bordered w-full focus:outline-none" type="text"
          [class.input-error]="submitted() && !nome().trim()"
          [ngModel]="nome()" (ngModelChange)="nome.set($event)" />
        @if (submitted() && !nome().trim()) {
          <p class="text-error text-xs">Campo obrigatório</p>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold">Data de nascimento</label>
        <input class="input input-bordered w-full focus:outline-none" type="date"
          [ngModel]="dataNascimento()" (ngModelChange)="dataNascimento.set($event)" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold">Diagnóstico</label>
          <input class="input input-bordered w-full focus:outline-none" type="text"
            placeholder="Ex: TEA nível 2"
            [ngModel]="diagnostico()" (ngModelChange)="diagnostico.set($event)" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold">CID-10</label>
          <input class="input input-bordered w-full focus:outline-none" type="text"
            placeholder="Ex: F84.0"
            [ngModel]="cid10()" (ngModelChange)="cid10.set($event)" />
        </div>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold">Observações gerais</label>
        <textarea class="textarea textarea-bordered w-full resize-none focus:outline-none" rows="4"
          placeholder="Rotinas, preferências, necessidades especiais..."
          [ngModel]="observacoes()" (ngModelChange)="observacoes.set($event)"></textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-1 border-t border-base-200">
        @if (saved()) {
          <span class="text-success text-sm font-medium">Salvo!</span>
        }
        <button class="btn btn-primary btn-sm" (click)="save()" [disabled]="saving()">
          @if (saving()) { <span class="loading loading-spinner loading-xs"></span> }
          Salvar
        </button>
      </div>

    </div>
  </div>

</div>
}
