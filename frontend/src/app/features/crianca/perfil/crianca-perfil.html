@if (crianca(); as c) {
<div class="flex flex-col gap-6">
  <!-- Avatar -->
  <div class="flex items-center gap-6">
    <label class="cursor-pointer relative group">
      <app-avatar [fotoUrl]="fotoUrl()" [nome]="nome() || c.nome" size="lg" />
      <div class="absolute inset-0 rounded-full bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
        @if (uploadingFoto()) {
          <span class="loading loading-spinner loading-sm text-white"></span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
        }
      </div>
      <input type="file" class="hidden" accept="image/*" (change)="onFotoSelected($event)" />
    </label>
    <div>
      <p class="text-lg font-bold">{{ c.nome }}</p>
      <p class="text-sm text-base-content/60">Clique na foto para alterar</p>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <!-- Nome -->
    <div class="form-control sm:col-span-2">
      <label class="label"><span class="label-text font-semibold">Nome completo</span></label>
      <input class="input input-bordered" type="text"
        [ngModel]="nome()" (ngModelChange)="nome.set($event)" name="nome" />
    </div>

    <!-- Data de nascimento -->
    <div class="form-control">
      <label class="label"><span class="label-text font-semibold">Data de nascimento</span></label>
      <input class="input input-bordered" type="date"
        [ngModel]="dataNascimento()" (ngModelChange)="dataNascimento.set($event)" name="dataNascimento" />
    </div>

    <!-- Diagnóstico -->
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">Diagnóstico</span>
        <span class="label-text-alt text-base-content/50">Ex: TEA nível 2</span>
      </label>
      <input class="input input-bordered" type="text" placeholder="Diagnóstico clínico"
        [ngModel]="diagnostico()" (ngModelChange)="diagnostico.set($event)" name="diagnostico" />
    </div>

    <!-- CID-10 -->
    <div class="form-control">
      <label class="label">
        <span class="label-text font-semibold">CID-10</span>
        <span class="label-text-alt text-base-content/50">Ex: F84.0</span>
      </label>
      <input class="input input-bordered" type="text" placeholder="Código CID-10"
        [ngModel]="cid10()" (ngModelChange)="cid10.set($event)" name="cid10" />
    </div>

    <!-- Observações -->
    <div class="form-control sm:col-span-2">
      <label class="label">
        <span class="label-text font-semibold">Observações gerais</span>
      </label>
      <textarea class="textarea textarea-bordered resize-none" rows="4"
        placeholder="Informações relevantes sobre a criança, rotinas, preferências, necessidades especiais..."
        [ngModel]="observacoes()" (ngModelChange)="observacoes.set($event)" name="observacoes"></textarea>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <button class="btn btn-primary" (click)="save()" [disabled]="saving()">
      @if (saving()) { <span class="loading loading-spinner loading-xs"></span> }
      Salvar alterações
    </button>
    @if (saved()) {
      <span class="text-success text-sm font-medium">Salvo com sucesso!</span>
    }
  </div>
</div>
}
