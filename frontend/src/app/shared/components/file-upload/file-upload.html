<label class="btn btn-ghost btn-sm gap-1 cursor-pointer">
  @if (uploading()) {
    <span class="loading loading-spinner loading-xs"></span>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M8 4a3 3 0 00-3 3v4a5 5 0 0010 0V7a1 1 0 112 0v4a7 7 0 11-14 0V7a3 3 0 016 0v4a3 3 0 006 0V7a5 5 0 00-10 0v4a1 1 0 11-2 0V7a7 7 0 0114 0v4a5 5 0 01-10 0V7a3 3 0 016 0z" clip-rule="evenodd"/>
    </svg>
  }
  {{ label() }}
  <input
    type="file"
    class="hidden"
    [accept]="accept()"
    [multiple]="multiple()"
    (change)="onFilesSelected($event)"
  />
</label>
@if (error()) {
  <span class="text-error text-xs">{{ error() }}</span>
}
