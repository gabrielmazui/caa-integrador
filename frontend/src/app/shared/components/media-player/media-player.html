<div class="custom-player" [class.custom-player-video]="kind() === 'video'">
  @if (kind() === 'audio') {
    <audio #media [src]="src()" preload="metadata"
      (loadeddata)="updateState($event)" (canplay)="updateState($event)" (loadedmetadata)="updateState($event)" (durationchange)="updateState($event)"
      (timeupdate)="updateState($event)" (progress)="updateState($event)"
      (play)="updateState($event)" (pause)="updateState($event)" (ended)="updateState($event)"></audio>

    <div class="audio-player-shell">
      <button type="button" class="media-play-button" (click)="togglePlayback()"
        [attr.aria-label]="playing() ? 'Pausar áudio' : 'Reproduzir áudio'">
        @if (playing()) {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.75A1.75 1.75 0 0 1 8.75 4h.5A1.75 1.75 0 0 1 11 5.75v12.5A1.75 1.75 0 0 1 9.25 20h-.5A1.75 1.75 0 0 1 7 18.25V5.75Zm6 0A1.75 1.75 0 0 1 14.75 4h.5A1.75 1.75 0 0 1 17 5.75v12.5A1.75 1.75 0 0 1 15.25 20h-.5A1.75 1.75 0 0 1 13 18.25V5.75Z"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 5.2a1.5 1.5 0 0 1 2.28-1.27l9.05 6.8a1.58 1.58 0 0 1 0 2.54l-9.05 6.8a1.5 1.5 0 0 1-2.28-1.27V5.2Z"/></svg>
        }
      </button>
      <div class="media-main">
        <div class="flex items-center justify-between gap-3 mb-1.5">
          <span class="media-title">{{ title() || 'Mensagem de áudio' }}</span>
          <span class="media-time">{{ formatTime(currentTime()) }} / {{ durationLabel() }}</span>
        </div>
        <div class="media-range-wrap" [style.--progress]="progress() + '%'" [style.--loaded]="loadedProgress() + '%'">
          <input class="media-range" type="range" min="0" [max]="duration() || 0" step="0.1"
            [value]="currentTime()" (input)="seek($event)" aria-label="Progresso do áudio" />
        </div>
      </div>
      <button type="button" class="media-icon-button" (click)="toggleMute()"
        [attr.aria-label]="muted() ? 'Ativar som' : 'Silenciar'">
        @if (muted() || volume() === 0) {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h4l5 4V5.5l-5 4H4Zm11.8 1.05 1.45 1.45-1.45 1.45 1.06 1.06 1.45-1.45 1.45 1.45 1.06-1.06L19.37 12l1.45-1.45-1.06-1.06-1.45 1.45-1.45-1.45-1.06 1.06Z"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h4l5 4V5.5l-5 4H4Zm11.5-.65v6.3a4 4 0 0 0 0-6.3Zm0-3.15v2.05a6 6 0 0 1 0 8.5v2.05a8 8 0 0 0 0-12.6Z"/></svg>
        }
      </button>
    </div>
  } @else {
    <div class="video-player-shell" [class.is-paused]="!playing()">
      <video #media [src]="src()" preload="metadata" playsinline
        (click)="togglePlayback()" (loadeddata)="updateState($event)" (canplay)="updateState($event)" (loadedmetadata)="updateState($event)" (durationchange)="updateState($event)"
        (timeupdate)="updateState($event)" (progress)="updateState($event)"
        (play)="updateState($event)" (pause)="updateState($event)" (ended)="updateState($event)"></video>

      @if (!playing()) {
        <button type="button" class="video-center-play" (click)="togglePlayback()" aria-label="Reproduzir vídeo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 5.2a1.5 1.5 0 0 1 2.28-1.27l9.05 6.8a1.58 1.58 0 0 1 0 2.54l-9.05 6.8a1.5 1.5 0 0 1-2.28-1.27V5.2Z"/></svg>
        </button>
      }

      <div class="video-controls">
        <div class="media-range-wrap" [style.--progress]="progress() + '%'" [style.--loaded]="loadedProgress() + '%'">
          <input class="media-range" type="range" min="0" [max]="duration() || 0" step="0.1"
            [value]="currentTime()" (input)="seek($event)" aria-label="Progresso do vídeo" />
        </div>
        <div class="flex items-center gap-2 mt-1">
          <button type="button" class="video-icon-button" (click)="togglePlayback()" [attr.aria-label]="playing() ? 'Pausar' : 'Reproduzir'">
            @if (playing()) { <svg viewBox="0 0 24 24"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg> }
            @else { <svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg> }
          </button>
          <button type="button" class="video-icon-button" (click)="toggleMute()" [attr.aria-label]="muted() ? 'Ativar som' : 'Silenciar'">
            <svg viewBox="0 0 24 24"><path d="M4 9.5v5h4l5 4V5.5l-5 4H4Zm11.5-.65v6.3a4 4 0 0 0 0-6.3Z"/></svg>
          </button>
          <input class="volume-range" type="range" min="0" max="1" step="0.05" [value]="muted() ? 0 : volume()" (input)="setVolume($event)" aria-label="Volume" />
          <span class="media-time text-white ml-1">{{ formatTime(currentTime()) }} / {{ durationLabel() }}</span>
          <span class="flex-1"></span>
          <button type="button" class="video-icon-button" (click)="toggleFullscreen()" aria-label="Tela cheia">
            <svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5V5Zm9 0h5v5h-2V7h-3V5ZM5 14h2v3h3v2H5v-5Zm12 0h2v5h-5v-2h3v-3Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  }
</div>
