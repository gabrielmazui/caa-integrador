spring.application.name=caa-integrador

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caa_db}
spring.datasource.username=${POSTGRES_USER:caa_user}
spring.datasource.password=${POSTGRES_PASSWORD:caa_password}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.error.include-message=never
